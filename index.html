<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeakUp – Inglés hablando</title>
<meta name="theme-color" content="#22b573">
<meta name="apple-mobile-web-app-title" content="SpeakUp">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#2b2a33; --muted:#7a7684; --line:#efe6da;
  --green:#22b573; --green-d:#169159; --red:#f0544f; --red-d:#c93c37;
  --blue:#3b82f6; --blue-d:#2563c9; --yellow:#ffc531; --yellow-d:#d9a400; --purple:#8b5cf6; --purple-d:#6d3fd6;
  --orange:#ff8a3d; --orange-d:#e06a1c; --gray:#d9d3c9; --gray-d:#bdb5a8;
  --soft-green:#e6f8ef; --soft-red:#fdeceb; --soft-blue:#e9f1ff; --soft-yellow:#fff4d6; --soft-purple:#f1ebff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 110px}
.hidden{display:none!important}

/* header stats */
.stats{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.logo{font-weight:900;font-size:24px;margin-right:auto}
.logo span{color:var(--green)}
.logo .appicon{display:inline-flex}
.chip{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:5px 10px;font-weight:900;font-size:16px}
.goal{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.goal .pbar{flex:1}
.pbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:var(--green);border-radius:99px;transition:width .4s}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;z-index:10}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:10px 4px calc(14px + env(safe-area-inset-bottom));font:800 13px Nunito;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:26px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--blue)}
nav button.on span{filter:none;opacity:1}

/* path */
.level{margin:6px 0 4px;border-radius:20px;padding:14px 16px;color:#fff;font-weight:900}
.level small{display:block;font-weight:700;opacity:.9}
.level.locked{background:var(--gray)!important;color:#fff}
.unitname{font-weight:900;color:var(--muted);text-align:center;margin:20px 0 34px;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0}
.node{width:76px;height:70px;border-radius:50%;border:0;font-size:30px;cursor:pointer;color:#fff;position:relative;transition:transform .1s}
.node:active{transform:translateY(4px)}
.node.done{background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d)}
.node.open{background:var(--green);box-shadow:0 7px 0 var(--green-d);animation:bob 1.6s ease-in-out infinite}
.node.locked{background:var(--gray);box-shadow:0 7px 0 var(--gray-d);cursor:not-allowed}
.node .lbl{position:absolute;top:50%;transform:translateY(-50%);left:90px;white-space:nowrap;color:var(--ink);font-size:14px;font-weight:800;text-align:left}
.node.r .lbl{left:auto;right:90px;text-align:right}
@keyframes bob{50%{transform:translateY(-4px)}}
.start-tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:13px;color:var(--green-d);font-weight:900}

/* generic */
h2{font-size:24px;font-weight:900;margin:4px 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 4px 0 var(--line)}
.big{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);line-height:1.35;box-shadow:0 4px 0 var(--line)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.big .ico{font-size:32px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;flex:none}
.big b{font-size:18px;display:block}
.big small{color:var(--muted);font-size:14px}
.big .right{margin-left:auto;font-weight:900;color:var(--muted);font-size:14px;white-space:nowrap}
.btn{font:800 17px Nunito;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.white{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);padding:0 6px}
.top .pbar{flex:1}
.notice{background:var(--soft-yellow);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:14px;display:none}

/* exercise */
.step{font-size:14px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.en-big{font-size:30px;font-weight:900;line-height:1.2;margin:8px 0}
.es-big{font-size:18px;color:var(--muted);margin-bottom:12px}
.phon{display:inline-block;background:var(--soft-yellow);border-radius:12px;padding:6px 12px;font-weight:800;margin-bottom:14px}
.phon small{font-weight:600;color:var(--muted)}
.speaker{width:72px;height:72px;border-radius:22px;border:0;background:var(--blue);color:#fff;font-size:32px;cursor:pointer;box-shadow:0 5px 0 var(--blue-d);flex:none}
.speaker.slow{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:28px}
.speaker.huge{width:120px;height:120px;font-size:52px;border-radius:32px}
.speaker:active{transform:translateY(3px)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font:800 18px Nunito;cursor:pointer;box-shadow:0 4px 0 var(--line);text-align:left;color:var(--ink)}
.opt.good{background:var(--soft-green);border-color:var(--green);color:var(--green-d)}
.opt.bad{background:var(--soft-red);border-color:var(--red);color:var(--red-d)}
.emojis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.emojis .opt{font-size:56px;text-align:center;padding:16px 0}
.bigemoji{font-size:90px;text-align:center;line-height:1.1}

.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px}
.mic{width:106px;height:106px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 0 var(--red-d)}
.mic svg{width:44px;height:44px}
.mic.live{animation:pulse 1.1s infinite;background:#ff3b30}
.mic:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,84,79,.55),0 6px 0 var(--red-d)}100%{box-shadow:0 0 0 26px rgba(240,84,79,0),0 6px 0 var(--red-d)}}
.mic-label{font-weight:800;text-align:center}
.live-text{color:var(--muted);font-style:italic;min-height:24px;text-align:center}

.result{margin-top:16px;border-radius:22px;padding:18px}
.result.good{background:var(--soft-green)}.result.mid{background:var(--soft-yellow)}.result.bad{background:var(--soft-red)}
.verdict{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;font-size:21px}
.w{padding:3px 10px;border-radius:10px;font-weight:800;background:#fff}
.w.ok{color:var(--green-d)}
.w.no{color:var(--red-d);text-decoration:underline wavy;cursor:pointer}
.heard{font-size:15px;color:var(--muted)}
.err{background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:10px}
.err .xx{color:var(--red-d);font-weight:800;text-decoration:line-through}
.err .v{color:var(--green-d);font-weight:900}
.err button{margin-left:auto;border:0;background:var(--soft-blue);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:16px;flex:none}
.tip{background:#fff;border-radius:14px;padding:12px;margin-top:10px;font-size:16px;white-space:pre-wrap}
.tip b{display:block;margin-bottom:4px}
.xpgain{color:var(--yellow-d);font-weight:900}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;margin:8px 0 10px}
.msg{padding:14px;border-radius:20px;max-width:92%}
.msg.t{background:var(--card);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.m{background:var(--soft-blue);align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{font-size:13px;font-weight:900;color:var(--muted);margin-bottom:4px}
.msg .en{font-size:19px;font-weight:800}
.msg .es{font-size:15px;color:var(--muted);margin-top:4px}
.say{border:0;background:var(--soft-blue);border-radius:10px;padding:4px 9px;cursor:pointer;font-size:15px;margin-left:4px;vertical-align:2px}
.suggest{background:var(--soft-yellow);border-radius:16px;padding:12px 14px;align-self:stretch}
.suggest .lbl{font-size:13px;font-weight:900;color:#a77a00;text-transform:uppercase}
.fixbox{margin-top:10px;background:var(--soft-red);border-radius:14px;padding:10px 12px;font-size:15px}
.fixbox.ok{background:var(--soft-green)}
.labpanel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;position:sticky;top:0;z-index:5}
.labpanel .lbl{font-size:13px;font-weight:900;color:var(--purple);text-transform:uppercase}
.goalrow{font-size:15px;font-weight:700;padding:2px 0;color:var(--muted)}
.goalrow.ok{color:var(--green-d)}
.msg.report{max-width:100%;align-self:stretch}
.party{position:fixed;inset:0;z-index:100;background:rgba(43,42,51,.55);overflow:hidden;display:grid;place-items:center;padding:20px}
.party.light{background:none;pointer-events:none}
.balloon{position:absolute;bottom:-100px;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-60vh) rotate(8deg)}100%{transform:translateY(-125vh) rotate(-8deg)}}
.conf{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
.party:not(.light) .conf{animation-iteration-count:infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.party-card{position:relative;z-index:2;background:var(--card);border-radius:28px;padding:26px;text-align:center;max-width:380px;width:100%;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.party-card .badge{font-size:84px;animation:wiggle 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes wiggle{50%{transform:rotate(10deg) scale(1.08)}}
.chathead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none}
.online{color:var(--green-d);font-size:13px;font-weight:800}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding-top:22px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.done{text-align:center;padding:28px 10px}
.done .emoji{font-size:72px}
.bigstat{display:flex;gap:10px;margin:16px 0}
.bigstat div{flex:1;border:2px solid var(--line);border-radius:16px;padding:10px;font-weight:900;font-size:22px}
.bigstat small{display:block;font-size:13px;color:var(--muted)}
.lessonmode .stats,.lessonmode .goal{display:none}
body.lessonmode nav{display:none}
body.lessonmode #notice{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="stats" id="statsBar">
    <div class="logo" style="display:flex;align-items:center;gap:8px"><span class="appicon"><svg width="34" height="34" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd187"/><stop offset="1" stop-color="#169159"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><path d="M118 140h276a40 40 0 0 1 40 40v130a40 40 0 0 1-40 40H250l-78 62v-62h-54a40 40 0 0 1-40-40V180a40 40 0 0 1 40-40z" fill="#fff"/><rect x="226" y="176" width="60" height="104" rx="30" fill="#f0544f"/><path d="M196 248a60 60 0 0 0 120 0" fill="none" stroke="#f0544f" stroke-width="18" stroke-linecap="round"/><path d="M256 308v22" stroke="#f0544f" stroke-width="18" stroke-linecap="round"/><circle cx="404" cy="112" r="44" fill="#ffc531"/><path d="M404 88l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#fff"/></svg>
</span><b style="font-weight:900">Speak<span>Up</span></b></div>
    <button class="chip" id="setBtn" style="cursor:pointer" title="Ajustes">⚙️</button>
    <div class="chip" title="Racha de días">🔥 <span id="streak">0</span></div>
    <div class="chip" title="Puntos XP">⭐ <span id="xp">0</span></div>
  </div>
  <div class="notice" id="notice"></div>

  <!-- CAMINO -->
  <section id="tab-path">
    <div class="goal"><div style="font-weight:900">🎯 Meta de hoy</div><div class="pbar"><div id="goalFill" style="width:0"></div></div><div style="font-weight:900;color:var(--muted)" id="goalTxt">0/50</div></div>
    <div id="pathList"></div>
  </section>

  <!-- PALABRAS (estilo Drops) -->
  <section id="tab-words" class="hidden">
    <h2>🧩 Palabras</h2>
    <p class="sub">Juegos rápidos de 2 minutos con dibujos. Escucha, toca y dilo.</p>
    <div id="wordCats"></div>
  </section>

  <!-- AMIGOS (estilo HelloTalk / Tandem) -->
  <section id="tab-friends" class="hidden">
    <h2>💬 Amigos para practicar</h2>
    <p class="sub">Conversa por voz con personajes de IA. Te corrigen y te dan ideas de qué decir.</p>
    <div style="font-weight:900;margin-bottom:6px">Tu nivel para conversar:</div>
    <select id="chatLevel" style="font:800 16px Nunito;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);width:100%;margin-bottom:16px">
      <option value="A1">A1 · Fácil</option><option value="A2">A2 · Intermedio</option><option value="B1">B1 · Normal</option><option value="B2">B2 · Difícil</option><option value="C1">C1 · Súper difícil</option></select>
    <div id="friendList"></div>
  </section>

  <!-- PANTALLA DE EJERCICIO -->
  <section id="play" class="hidden">
    <div class="top"><button class="x" id="quit" aria-label="Salir">✕</button><div class="pbar"><div id="pfill" style="width:0"></div></div></div>
    <div id="playBody"></div>
  </section>

  <!-- CHAT -->
  <section id="chatView" class="hidden">
    <div class="chathead"><button class="x" id="chatBack">←</button><div class="avatar" id="cAv"></div><div><b id="cName" style="font-size:18px"></b><div class="online" id="cSub"></div></div></div>
    <div id="labPanel" class="labpanel hidden"></div>
    <div class="chat" id="chat"></div>
    <div class="sticky">
      <div class="live-text" id="liveChat"></div>
      <div class="micwrap" style="margin-top:6px">
        <button class="mic" id="micChat" disabled aria-label="Hablar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
        <div class="mic-label" id="chatLabel">Toca para responder</div>
      </div>
    </div>
  </section>
</div>

<nav id="nav"><div class="in">
  <button class="on" data-tab="path"><span>🏠</span>Camino</button>
  <button data-tab="words"><span>🧩</span>Palabras</button>
  <button data-tab="friends"><span>💬</span>Amigos</button>
</div></nav>

const LESSONS=[]; // {key, unit, level, phrases:[idx...], n}
LEVELS.forEach((L,li)=>L.units.forEach(uid=>{
  const ph=UNITS[uid].phrases; let n=1;
  for(let i=0;i<ph.length;i+=4){ LESSONS.push({key:uid+"-"+n,unit:uid,level:li,idx:[...Array(Math.min(4,ph.length-i)).keys()].map(k=>k+i),n:n++}); }
}));

 // frase número idx de la plantilla ti
 make(ti,idx){
   const t=GT[ti], parts=[]; let r=idx, firstVB=-1;
   t.s.forEach(k=>{
     if(k==="VB2"){ const n=GL.VB.length-1; let j=r%n; r=Math.floor(r/n); if(j>=firstVB) j++; parts.push(GL.VB[j]); }
     else { const L=GL[k], j=r%L.length; r=Math.floor(r/L.length); if(k==="VB") firstVB=j; parts.push(L[j]); }
   });
   const [en,es]=t.f(...parts);
   return [en.charAt(0).toUpperCase()+en.slice(1), fixES(es), ""];
 },
 // n frases al azar del nivel, evitando las ya vistas
 pick(lv,n,seen){
   const ts=GT.map((t,i)=>i).filter(i=>GT[i].lv===lv), out=[], keys=[];
   const total=ts.reduce((s,i)=>s+gtSize(GT[i]),0);
   for(let tries=0;out.length<n&&tries<n*40;tries++){
     let x=Math.floor(Math.random()*total), ti=ts[0];
     for(const i of ts){ const sz=gtSize(GT[i]); if(x<sz){ ti=i; break; } x-=sz; }
     const key=ti+":"+x; if(seen.has(key)||keys.includes(key)) continue;
     // evitar dos frases de la misma plantilla en una ronda
     if(keys.some(k=>k.split(":")[0]==String(ti))&&tries<n*20) continue;
     keys.push(key); out.push(GEN.make(ti,x));
   }
   return {phrases:out,keys};
 }
};

"b2-debate":[
 ["So, what do you think is better, working from home or working in an office?","Entonces, ¿qué crees que es mejor, trabajar desde casa o en una oficina?",[["I think working from home is better","Creo que trabajar desde casa es mejor"],["In my opinion, working in an office is better","En mi opinión, trabajar en una oficina es mejor"]],1],
 ["Really? Why do you think so?","¿En serio? ¿Por qué lo crees?",[["Because you save time and money on transportation","Porque ahorras tiempo y dinero en transporte"],["Because it is easier to communicate with your team","Porque es más fácil comunicarte con tu equipo"]],2],
 ["Okay, but is that the only reason?","Bueno, ¿pero esa es la única razón?",[["Also, you can focus better without distractions","Además, te puedes concentrar mejor sin distracciones"],["Another reason is that you can learn from your coworkers","Otra razón es que puedes aprender de tus compañeros"]],2],

 ["Hmm, maybe. But what about productivity? Some people get lazy at home.","Mmm, tal vez. ¿Pero y la productividad? Algunas personas se vuelven flojas en casa.",[["It depends on the person, some people are more productive at home","Depende de la persona, algunas son más productivas en casa"],["On the other hand, offices have a lot of interruptions","Por otro lado, las oficinas tienen muchas interrupciones"]],4],
 ["Fair point. What about jobs like yours at the restaurant?","Buen punto. ¿Y los trabajos como el tuyo en el restaurante?",[["Of course, some jobs can't be done from home","Claro, algunos trabajos no se pueden hacer desde casa"],["That is a different situation, you need to be there in person","Esa es otra situación, tienes que estar ahí en persona"]],0],
 ["So maybe the best option is a mix?","¿Entonces tal vez la mejor opción es una mezcla?",[["I agree, a hybrid model could be the best of both worlds","Estoy de acuerdo, un modelo híbrido podría ser lo mejor de los dos mundos"],["Maybe, but I still prefer working from home","Tal vez, pero aún prefiero trabajar desde casa"]],0],
 ["What would you choose for your future IT job?","¿Qué elegirías para tu futuro trabajo en IT?",[["I would choose a hybrid job, two days in the office","Elegiría un trabajo híbrido, dos días en la oficina"],["I would prefer remote work so I can live anywhere","Preferiría trabajo remoto para poder vivir donde sea"]],0],
 ["Interesting. So, what's your final conclusion?","Interesante. ¿Y cuál es tu conclusión final?",[["In conclusion, working from home is better for most people","En conclusión, trabajar desde casa es mejor para la mayoría"],["Overall, I think it depends on the job and the person","En general, creo que depende del trabajo y de la persona"]],5],
 ["Good debate! You convinced me a little.","¡Buen debate! Me convenciste un poco.",[["Thanks, you had good arguments too","Gracias, tú también tuviste buenos argumentos"],["That was fun, let's debate again soon","Fue divertido, debatamos otra vez pronto"]],0]

/* ---- Micrófono: reconocimiento de voz del navegador (Safari en iPhone, Chrome en Android) ---- */
function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let rec=null,cbP=()=>{},cbF=()=>{},cbS=()=>{},stopRes=null,userStop=false;
  function attach(r,onFirstError){
    r.lang="en-US"; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
    let started=false;
    r.onstart=()=>{ started=true; cbS({state:"listening"}); };
    r.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal) cbF({text:res[0].transcript.trim()}); else interim+=res[0].transcript; } cbP({text:interim.trim()}); };
    r.onerror=e=>{ if(!started&&onFirstError) onFirstError(e); };
    r.onend=()=>{
      rec=null;
      if(userStop){ cbS({state:"idle",reason:"stopped"}); if(stopRes){stopRes();stopRes=null;} return; }
      // El teléfono (sobre todo iPhone) a veces corta solo el micrófono tras una pausa corta.
      // Lo reiniciamos de inmediato, sin avisar a la pantalla, para que no se pierda lo que sigue diciendo.
      try{ const nr=new SR(); attach(nr,null); rec=nr; rec.start(); }
      catch(e){ cbS({state:"idle",reason:"ended"}); if(stopRes){stopRes();stopRes=null;} }
    };
  }
  return {
    onPartial(f){cbP=f}, onFinal(f){cbF=f}, onState(f){cbS=f},
    start(){ return new Promise((resolve,reject)=>{
      try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
      userStop=false; rec=new SR();
      attach(rec,e=>reject({code:(e.error==="not-allowed"||e.error==="service-not-allowed")?"not_granted":"error"}));
      const firstStart=rec.onstart;
      rec.onstart=()=>{ firstStart(); resolve(); };
      try{ rec.start(); }catch(err){ reject({code:"error"}); }
    }); },
    stop(){ return new Promise(res=>{ if(!rec){res();return;} userStop=true; stopRes=res; try{rec.stop();}catch(e){res();} setTimeout(()=>{ if(stopRes){stopRes();stopRes=null;} },1800); }); }
  };
}
/* ---- IA opcional: clave GRATIS de Google Gemini (o de Anthropic), guardada solo en este teléfono ---- */
const KEY_NAME="speakup-api-key";
const getKey=()=>{ try{ return localStorage.getItem(KEY_NAME)||""; }catch(e){ return ""; } };
const GEMINI_MODELS=["gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-flash"];
function makeAI(){
  const key=getKey(); if(!key) return null;
  async function gemini(input,json){
    let lastErr=null;
    for(const m of GEMINI_MODELS){
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",
        headers:{"content-type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({contents:[{role:"user",parts:[{text:String(input)}]}],generationConfig:json?{responseMimeType:"application/json",temperature:0.8}:{temperature:0.8}})});
      if(r.status===404||r.status===400&&/model/i.test(await r.clone().text())){ lastErr={code:"no_model"}; continue; }
      if(r.status===429) throw {code:"rate_limited"};
      if(r.status===401||r.status===403) throw {code:"bad_key"};
      if(!r.ok) throw {code:"error",message:await r.text()};
      const j=await r.json();
      const text=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      return {text,truncated:false};
    }
    throw lastErr||{code:"error"};
  }
  async function anthropic(input,opts){
    const model=opts.modelTier==="default"?"claude-sonnet-5-5":"claude-haiku-5-5";
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:1500,messages:[{role:"user",content:String(input)}]})});
    if(r.status===429) throw {code:"rate_limited"};
    if(r.status===401) throw {code:"bad_key"};
    if(!r.ok) throw {code:"error",message:await r.text()};
    const j=await r.json();
    return {text:(j.content||[]).map(c=>c.text||"").join(""),truncated:j.stop_reason==="max_tokens"};
  }
  const call=(i,o={},json=false)=>key.startsWith("sk-ant")?anthropic(i,o):gemini(i,json);
  const f=(i,o)=>call(i,o||{});
  f.json=async(i,o)=>{ const {text}=await call(i+"\n\nRespond with valid JSON only. No code fences, no extra text.",o||{},true); const m=text.match(/\{[\s\S]*\}/); return JSON.parse(m?m[0]:text); };
  return f;

const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const HAS_WEB_TTS="speechSynthesis" in window;
let VOICES={en:null,es:null};
function pickVoices(){
  if(!HAS_WEB_TTS) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  const find=(re,pref)=>vs.find(v=>re.test(v.lang)&&pref.some(p=>v.name.includes(p)))||vs.find(v=>re.test(v.lang));
  VOICES.en=find(/^en[-_]US/i,["Samantha","Ava","Allison","Google US"])||find(/^en/i,[]);
  VOICES.es=find(/^es[-_](US|MX)/i,["Paulina","Mónica","Google"])||find(/^es/i,[]);
}
if(HAS_WEB_TTS){ pickVoices(); speechSynthesis.onvoiceschanged=pickVoices; }
let webUnlocked=false;
function unlockWebTTS(){
  if(webUnlocked||!HAS_WEB_TTS) return; webUnlocked=true;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
["pointerdown","touchstart","click"].forEach(ev=>document.addEventListener(ev,unlockWebTTS,{capture:true,passive:true}));

function webSay(lines){
  if(!HAS_WEB_TTS) return Promise.resolve();
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
  if(!VOICES.en) pickVoices();
  // Se ponen en cola todas juntas (iOS solo deja hablar si se pide durante el toque)
  return Promise.all(lines.map(l=>new Promise(res=>{
    const u=new SpeechSynthesisUtterance(l.text);
    const es=l.lang==="es"; u.lang=es?"es-US":"en-US";
    const v=es?VOICES.es:VOICES.en; if(v) u.voice=v;
    u.rate=Math.max(0.5,Math.min(1.2,(l.rate||0.85)*(IOS?1:1)));
    let done=false; const fin=()=>{ if(!done){done=true;res();} };
    u.onend=fin; u.onerror=fin; setTimeout(fin,1500+l.text.length*140);
    speechSynthesis.speak(u);
  })));
}

async function speak(text,rate=0.85,voice){
  if(tts){ try{ await tts.speak(text,voice?{language:"en",rate,voice}:{language:"en",rate}); return; }catch(e){ const c=(e&&e.code)||""; if(c==="busy"||/stop|cancel|not_granted|rate/.test(c)) return; } }
  return webSay([{text,lang:"en",rate}]);
}

async function speakLines(lines){

    try{ await tts.speak(lines.map(l=>{const o={text:l.text,language:l.lang||"en",rate:l.rate||0.85}; if(l.voice) o.voice=l.voice; return o;})); return; }
    catch(e){ const c=(e&&e.code)||""; if(c==="busy"||/stop|cancel|not_granted|rate/.test(c)) return; }

}

function wireDict(){
  dict.onPartial(({text})=>{ partial=text; if(micCtx) micCtx.live.textContent=[...finals,text].join(" "); });
  dict.onFinal(({text})=>{ finals.push(text); partial=""; if(micCtx) micCtx.live.textContent=finals.join(" "); });
  dict.onState(({state,reason})=>{
    if(!micCtx) return;
    micCtx.btn.classList.toggle("live",state==="listening");
    if(state==="idle"&&reason==="ended"&&!micCtx.stopping){ micCtx.stopping=true; micCtx.done([...finals,partial].join(" ").trim()); }

/* ---------- Comparar lo dicho ---------- */
const NUM={one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",twenty:"20",thirty:"30",thousand:"1000"};
const CONTR={"i'm":["i","am"],"im":["i","am"],"it's":["it","is"],"you're":["you","are"],"what's":["what","is"],"where's":["where","is"],"i'll":["i","will"],"she's":["she","is"],"that's":["that","is"]};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean).flatMap(w=>CONTR[w]||[w]);
const eq=(a,b)=>a===b||NUM[a]===b||NUM[b]===a||a.replace(/'/g,"")===b.replace(/'/g,"");
function diff(T,S){
  const n=T.length,m=S.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=eq(T[i],S[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=Array(n).fill(false),errs=[]; let i=0,j=0,gt=[],gs=[];
  const flush=()=>{ if(gt.length) errs.push({want:gt.join(" "),said:gs.join(" ")}); gt=[]; gs=[]; };
  while(i<n||j<m){
    if(i<n&&j<m&&eq(T[i],S[j])){ flush(); ok[i]=true; i++; j++; }
    else if(j>=m||(i<n&&dp[i+1][j]>=dp[i][j+1])){ gt.push(T[i]); i++; }
    else { if(gt.length||i<n) gs.push(S[j]); j++; }
  }
  flush(); return {ok,errs};
}

async function checkSpeech(en,said,ctx,isLesson){
  if(!said){ ctx.label.textContent="No te escuché 🙉 Acércate al micrófono y habla un poco más fuerte"; return; }
  ctx.label.textContent="Toca para intentar otra vez";
  const T=norm(en),{ok,errs}=diff(T,norm(said));
  const pct=Math.round(100*ok.filter(Boolean).length/T.length);
  const pass=pct>=75;
  const cls=pct>=85?"good":pct>=50?"mid":"bad";
  const verdict=pct===100?"🎉 ¡Perfecto!":pct>=85?"👏 ¡Muy bien!":pct>=50?"💪 Casi":"🔁 Otra vez";
  const first=!ctx.scored; if(first){ ctx.scored=true; award(pass); }
  const errHtml=errs.map(e=>e.said
    ?`<div class="err"><span>Dijiste <span class="xx">${esc(e.said)}</span> → se dice <span class="v">${esc(e.want)}</span></span><button data-say="${esc(e.want)}" data-rate="0.7">🔊</button></div>`
    :`<div class="err"><span>No se escuchó <span class="v">${esc(e.want)}</span></span><button data-say="${esc(e.want)}" data-rate="0.7">🔊</button></div>`).join("");
  $("#res").innerHTML=`<div class="result ${cls}">
    <div class="verdict">${verdict} ${first&&pass?"<span class='xpgain'>+10 XP</span>":""}<span style="margin-left:auto;font-size:20px">${pct}%</span></div>

    <div class="heard">Lo que entendí: “${esc(said)}”</div>
    ${errs.length?`<div style="margin-top:10px;font-weight:900">Lo que hay que corregir:</div>${errHtml}`:""}
    <div class="tip hidden" id="tipL"></div>
    <div class="row" style="margin-top:14px">
      ${pct<100?`<button class="btn white" id="retry">🔁 Otra vez</button>`:""}
      <button class="btn ${pass?"":"blue"}" id="next">${pass?"Continuar ✓":"Seguir"}</button></div></div>`;
  $("#next").onclick=()=>{qi++;nextQ();};
  if($("#retry")) $("#retry").onclick=()=>{ $("#res").innerHTML=""; speak(en,0.7); };
  $("#res").scrollIntoView({behavior:"smooth",block:"nearest"});
  if(errs.length) speakLines(corrLines(errs,en)); else speakLines([{text:pct===100?"¡Perfecto!":"¡Muy bien!",lang:"es"}]);
  if(errs.length&&ai){
    const tip=$("#tipL"); tip.classList.remove("hidden"); tip.innerHTML='<span class="spin"></span> Pensando cómo ayudarte…';
    try{
      const r=await ai(`You help a total beginner (native Spanish speaker) with English pronunciation.
Target: "${en}". Speech recognition heard: "${said}".
Problems: ${errs.map(e=>e.said?`said "${e.said}" instead of "${e.want}"`:`"${e.want}" was not heard`).join("; ")}.
Start with "Eso no se pronuncia así." Then answer in SIMPLE Spanish, max 3 short lines, friendly. For each problem word say which sound is probably wrong and exactly how to move mouth/tongue/lips. Include how it sounds written the Spanish way (e.g. "zénk"). Plain text, no markdown, no asterisks.`,{modelTier:"quick"});
      const tx=r.text.trim(); tip.innerHTML=`<b>💡 Consejo de la IA <button class="say" data-es="${esc(tx)}">🔊 escuchar</button></b>`+esc(tx);
    }catch(e){ tip.classList.add("hidden"); }
  }
}

function renderWords(){
  $("#wordCats").innerHTML=Object.entries(WORDS).map(([k,c])=>{
    const learned=(P.words[k]||[]).length;
    return `<button class="big" data-cat="${esc(k)}"><div class="ico" style="background:var(--soft-purple)">${c.ico}</div>
      <div><b>${esc(k)}</b><small>${c.list.slice(0,4).map(w=>w[2]).join(" ")} …</small></div>
      <div class="right">${learned}/${c.list.length} ✓</div></button>`;
  }).join("");
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>startWords(b.dataset.cat));
}
function startWords(cat){
  const list=WORDS[cat].list, learned=P.words[cat]||[];
  const pick=shuffle([...list.filter(w=>!learned.includes(w[0])),...list.filter(w=>learned.includes(w[0]))]).slice(0,5);
  const q=[];
  pick.forEach(w=>q.push({render:rWordIntro,w,cat}));
  shuffle(pick).forEach(w=>q.push({render:rWordPick,w,list}));
  shuffle(pick).forEach(w=>q.push({render:rWordSay,w,cat}));
  startRun(q,{title:`Palabras · ${cat}`});
}
function rWordIntro(q){
  const [en,es,em,ph]=q.w;
  run.total--; // la presentación no cuenta para precisión
  $("#playBody").innerHTML=`<div class="card" style="text-align:center">
    <div class="step">Palabra nueva</div>
    <div class="bigemoji" style="margin:14px 0">${em}</div>
    <div class="en-big">${esc(en)}</div><div class="es-big">${esc(es)}</div>
    <div class="phon"><small>Suena como:</small> ${esc(ph)}</div>
    <div style="display:flex;gap:10px;justify-content:center"><button class="speaker" data-say="${esc(en)}">🔊</button><button class="speaker slow" data-say="${esc(en)}" data-rate="0.6">🐢</button></div>
    <button class="btn full" style="margin-top:20px" id="go">Entendido</button></div>`;
  setTimeout(()=>speak(en,0.8),250);
  $("#go").onclick=()=>{qi++;nextQ();};
}
function rWordPick(q){
  const [en,,em]=q.w;
  const opts=shuffle([q.w,...shuffle(q.list.filter(x=>x[0]!==en&&x[2]!==em)).slice(0,3)]);
  $("#playBody").innerHTML=`<div class="card" style="text-align:center">
    <div class="step">Escucha y toca el dibujo</div>
    <div style="margin:18px 0 0"><button class="speaker huge" data-say="${esc(en)}">🔊</button></div>
    <div class="emojis">${opts.map(o=>`<button class="opt" data-w="${esc(o[0])}">${o[2]}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  setTimeout(()=>speak(en,0.8),250);
  document.querySelectorAll(".emojis .opt").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.w===en;
    document.querySelectorAll(".emojis .opt").forEach(x=>{ x.disabled=true; if(x.dataset.w===en) x.classList.add("good"); });
    if(!ok) b.classList.add("bad");
    award(ok,5);
    $("#fb").innerHTML=`<div class="result ${ok?"good":"bad"}" style="text-align:left"><div class="verdict">${ok?"✅ ¡Sí! <span class='xpgain'>+5 XP</span>":"❌ Era este: "+em}</div>
      <div><b>${esc(en)}</b> = ${esc(q.w[1])}</div><button class="btn full ${ok?"":"blue"}" style="margin-top:12px" id="go">Continuar</button></div>`;
    $("#go").onclick=()=>{qi++;nextQ();};
  });
}
function rWordSay(q){
  const [en,es,em,ph]=q.w;
  $("#playBody").innerHTML=`<div class="card" style="text-align:center">
    <div class="step">¿Cómo se dice en inglés?</div>
    <div class="bigemoji" style="margin:14px 0">${em}</div>
    <div class="es-big">${esc(es)}</div>
    <details style="color:var(--muted);margin-bottom:6px"><summary style="cursor:pointer;font-weight:800">Ver pista</summary><div class="en-big">${esc(en)}</div><div class="phon">${esc(ph)}</div></details>
    <div class="micwrap"><div class="live-text" id="liveL"></div><button class="mic" id="micL" ${dict?"":"disabled"}>${MIC_SVG}</button><div class="mic-label" id="labelL">Toca y di la palabra</div></div>
    <div id="res" style="text-align:left"></div>
    <button class="btn white" style="margin-top:14px" id="skip">No puedo hablar ahora →</button></div>`;
  const ctx={btn:$("#micL"),live:$("#liveL"),label:$("#labelL"),done:said=>{
    if(!said){ ctx.label.textContent="No te escuché 🙉 Intenta otra vez"; return; }
    const ok=norm(said).some(w=>eq(w,en)||w===en+"s"||w+"s"===en);
    const first=!ctx.scored; if(first){ ctx.scored=true; award(ok,5); }
    if(ok){ P.words[q.cat]=P.words[q.cat]||[]; if(!P.words[q.cat].includes(en)){P.words[q.cat].push(en); save();} }
    ctx.label.textContent="Toca para intentar otra vez";
    $("#res").innerHTML=`<div class="result ${ok?"good":"bad"}"><div class="verdict">${ok?"✅ ¡Perfecto!"+(first?" <span class='xpgain'>+5 XP</span>":""):"❌ No sonó igual"}</div>
      ${ok?"":`<div class="err"><span>Dijiste <span class="xx">${esc(said)}</span> → se dice <span class="v">${esc(en)}</span> <small>(${esc(ph)})</small></span><button data-say="${esc(en)}" data-rate="0.65">🔊</button></div>`}
      <div class="row" style="margin-top:12px">${ok?"":`<button class="btn white" id="retry">🔁 Otra vez</button>`}<button class="btn ${ok?"":"blue"}" id="next">Continuar</button></div></div>`;
    $("#next").onclick=()=>{qi++;nextQ();};
    if($("#retry")) $("#retry").onclick=()=>{ $("#res").innerHTML=""; speak(en,0.65); };
    if(ok) speakLines([{text:"¡Perfecto!",lang:"es"}]);
    else speakLines([{text:"Eso no se pronuncia así. Se dice",lang:"es"},{text:en,lang:"en",rate:0.65},{text:"Repite conmigo.",lang:"es"},{text:en,lang:"en",rate:0.75}]);
  }};
  $("#micL").onclick=()=>micClick(ctx);
  $("#skip").onclick=()=>{qi++;nextQ();};
}

const CHAT_LV={
 A1:"a TOTAL BEGINNER (A1). Use very simple English, max 2 SHORT sentences (5-10 words each), common words only.",
 A2:"an elementary learner (A2). Use simple English, max 2 sentences, everyday vocabulary, simple past and future are OK.",

 C1:"an advanced learner (C1). Speak like a fluent native: natural, idioms, nuance, humor, complex ideas. Challenge him with deeper questions. Correct even small unnatural phrasing."};
function renderFriends(){

let CH=null,history=[],busy=false,turns=0;
const chat=$("#chat");
const cctx={btn:$("#micChat"),live:$("#liveChat"),label:$("#chatLabel"),done:onChatSaid};
$("#micChat").onclick=()=>micClick(cctx);
function updMic(){ $("#micChat").disabled=!dict||busy||!history.length; }
function alertBox(t){ $("#notice").innerHTML=t; $("#notice").style.display="block"; }

function openChat(c){

function renderLabPanel(){

     <button class="btn blue" id="finishLab" style="padding:9px 12px;font-size:15px">Terminar y evaluar</button></div>`;
  $("#finishLab").onclick=finishLab;

function chatPrompt(extra){
  const lab=CH.lab;
  return `You are ${CH.persona}
You are talking by voice with Angel, a native Spanish speaker who is ${CHAT_LV[CH.level]} Stay in character, be warm and natural.
${lab?`This is a ROLE-PLAY LAB. Scenario: ${lab.scenario}
Angel's goals (written in Spanish), numbered: ${lab.goals.map((g,i)=>(i+1)+") "+g).join(" ; ")}
Guide the conversation naturally so he gets chances to achieve every goal, without listing the goals. Make it a LONG, continuous conversation: keep adding small new developments, questions and surprises. Never end the conversation yourself, even after all goals are done.
`:""}Rules:
- "reply": follow the level above, end with ONE question or prompt so he keeps talking. Spoken aloud. No emojis.
- "reply_es": Spanish translation of reply.
- Angel's words come from speech recognition: ignore punctuation/capitals. If a word seems wrong but sounds like the right one, it is a PRONUNCIATION mistake: report it with type "pron".
- "mistakes": EVERY real mistake in what Angel just said, max 3: {"said":"his words","correct":"correct English","type":"pron" or "grammar" or "word","why":"very short explanation in simple Spanish; for pron say how to move the mouth"}. Empty if correct or at the start.
- "praise": short encouragement in Spanish if he did well, else empty.
- "suggest": an example answer at his level that Angel could say to YOUR question: {"en":"...","es":"..."}.
- "goals_done": ${lab?"numbers of ALL goals Angel has achieved so far in the whole conversation (cumulative)":"always []"}.
Return ONLY JSON: {"reply":"","reply_es":"","mistakes":[],"praise":"","suggest":{"en":"","es":""},"goals_done":[]}

Conversation so far:
${history.map(h=>(h.r==="t"?CH.name+": ":"Angel: ")+h.text).join("\n")||"(none)"}

${extra}`;
}

async function askChat(extra){
  busy=true; updMic(); cctx.label.textContent=CH.name+" está escribiendo…";
  const typing=addMsg("t",'<span class="spin"></span>');
  try{
    const r=await ai.json(chatPrompt(extra),{cache:false,modelTier:"quick"});
    typing.remove();
    const lines=[];
    const lastMe=[...chat.querySelectorAll(".msg.m")].pop();
    const ms=(r.mistakes||[]).filter(m=>m&&m.correct);
    if(lastMe&&!lastMe.querySelector(".fixbox")){
      const box=document.createElement("div");
      if(ms.length){
        box.className="fixbox";
        box.innerHTML="<b>✏️ Corrección</b>"+ms.map(m=>`<div style="margin-top:6px">${m.type==="pron"?"🗣️ ":""}<span style="text-decoration:line-through;color:var(--red-d)">${esc(m.said)}</span> → <b style="color:var(--green-d)">${esc(m.correct)}</b><button class="say" data-say="${esc(m.correct)}" data-rate="0.7">🔊</button><div class="es">${esc(m.why)}</div></div>`).join("");
        lines.push(...chatCorrLines(ms));
      } else { box.className="fixbox ok"; box.innerHTML="✅ "+esc(r.praise||"¡Bien dicho!")+" <span class='xpgain'>+5 XP</span>"; addXP(5); }
      lastMe.appendChild(box);
    }
    const reply=r.reply||"";
    history.push({r:"t",text:reply});
    addMsg("t",`<div class="who">${CH.av} ${esc(CH.name)}</div><div class="en">${esc(reply)} <button class="say" data-say="${esc(reply)}" data-voice="${CH.voice}">🔊</button><button class="say" data-say="${esc(reply)}" data-rate="0.65" data-voice="${CH.voice}">🐢</button></div><div class="es">${esc(r.reply_es||"")}</div>`);
    if(CH.lab&&Array.isArray(r.goals_done)){
      r.goals_done.forEach(n=>{ n=+n; if(n>=1&&n<=CH.lab.goals.length&&!CH.lab.done.includes(n)) CH.lab.done.push(n); });
      renderLabPanel();
      if(!CH.lab.announced&&CH.lab.done.length===CH.lab.goals.length){
        CH.lab.announced=true;
        addMsg("suggest",`<div class="lbl">🎉 ¡Misión cumplida!</div><div class="es" style="color:var(--ink)">Puedes seguir hablando para practicar más, o toca <b>Terminar y evaluar</b>.</div>`);
      }
    }
    if(r.suggest&&r.suggest.en) addMsg("suggest",`<div class="lbl">Puedes responder algo como:</div><div class="en" style="font-size:18px;font-weight:800">${esc(r.suggest.en)} <button class="say" data-say="${esc(r.suggest.en)}" data-rate="0.75">🔊</button></div><div class="es">${esc(r.suggest.es)}</div>`);
    busy=false; updMic(); cctx.label.textContent="Toca para responder";
    lines.push({text:reply,lang:"en",rate:0.85,voice:CH.voice});
    await speakLines(lines);
  }catch(e){
    typing.remove();
    addMsg("t",`<div class="es">${e&&e.code==="rate_limited"?"Espera unos segundos e intenta otra vez.":"No pude responder 😕 Intenta otra vez."}</div>`);
    busy=false; updMic(); cctx.label.textContent="Toca para responder";
  }
}
function chatCorrLines(ms){
  const pron=ms.find(m=>m.type==="pron");
  const L=[{text:pron?"Ojo, eso no se pronuncia así.":"Ojo, una corrección.",lang:"es"}];
  ms.slice(0,2).forEach(m=>{
    if(m.said) L.push({text:"No se dice",lang:"es"},{text:m.said,lang:"en"});
    L.push({text:"Se dice",lang:"es"},{text:m.correct,lang:"en",rate:0.7});
  });
  L.push({text:"Ahora sigamos.",lang:"es"});
  return L;
}
function onChatSaid(said){
  cctx.live.textContent="";
  if(!said){ cctx.label.textContent="No te escuché 🙉 Intenta otra vez"; return; }
  if(CH&&CH.scripted) return scriptHeard(said);
  chat.querySelectorAll(".suggest").forEach(s=>s.remove());
  history.push({r:"m",text:said}); turns++;
  addMsg("m",`<div class="who">Tú</div><div class="en">${esc(said)}</div>`);
  renderLabPanel();
  askChat(`Angel just said: "${said}". Reply as JSON.`);
}
function addMsg(cls,html){
  const d=document.createElement("div"); d.className=cls==="suggest"?"suggest":"msg "+cls; d.innerHTML=html;
  chat.appendChild(d); d.scrollIntoView({behavior:"smooth",block:"end"}); return d;
}

async function finishLab(){
  if(CH&&CH.scripted) return scriptFinish();
  if(busy||!CH.lab) return;
  if(history.filter(h=>h.r==="m").length<2){
    addMsg("suggest",`<div class="lbl">Habla un poco más</div><div class="es" style="color:var(--ink)">Responde por lo menos 2 veces para poder evaluarte.</div>`); return;
  }
  busy=true; updMic();
  const L=CH.lab, box=addMsg("t",'<span class="spin"></span> Preparando tu evaluación…');
  try{
    const r=await ai.json(`You are an English teacher evaluating a spoken role-play by Angel, a native Spanish speaker at CEFR level ${CH.level}. His lines come from speech recognition, so words that seem wrong but sound similar are pronunciation errors.
Scenario: ${L.scenario}
Goals (Spanish): ${L.goals.map((g,i)=>(i+1)+") "+g).join(" ; ")}
Transcript:
${history.map(h=>(h.r==="t"?CH.name+": ":"Angel: ")+h.text).join("\n")}
Be honest but encouraging. Return ONLY JSON:
{"score":0-100,"pronunciation":0-100,"grammar":0-100,"fluency":0-100,"goals_done":[goal numbers achieved],"good":["2 short things he did well, in Spanish"],"mistakes":[{"said":"","correct":"","why":"short Spanish explanation"}],"words":[{"en":"useful word or phrase for this scenario","es":""}],"advice":"one concrete tip in Spanish for next time"}
Max 5 mistakes, exactly 5 words.`,{modelTier:"default",cache:false});
    box.remove();
    const sc=Math.max(0,Math.min(100,Math.round(+r.score||0)));
    P.labs=P.labs||{}; P.labs[L.id]=Math.max(P.labs[L.id]||0,sc); save(); addXP(30);
    const bar=(lbl,v)=>`<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px"><span>${lbl}</span><span>${Math.round(+v||0)}</span></div><div class="pbar"><div style="width:${Math.round(+v||0)}%"></div></div></div>`;
    addMsg("t report",`<div style="text-align:center"><div style="font-size:56px">${sc>=80?"🏆":sc>=60?"🎉":"💪"}</div><div style="font-weight:900;font-size:22px">Resultado: ${sc}/100</div><div class="xpgain">+30 XP</div></div>
      ${bar("🗣️ Pronunciación",r.pronunciation)}${bar("📐 Gramática",r.grammar)}${bar("🌊 Fluidez",r.fluency)}
      ${(r.good||[]).length?`<div style="margin-top:12px;font-weight:900">✅ Lo que hiciste bien</div>${r.good.map(g=>`<div class="es" style="color:var(--ink)">• ${esc(g)}</div>`).join("")}`:""}
      ${(r.mistakes||[]).length?`<div style="margin-top:12px;font-weight:900">✏️ A corregir</div>${r.mistakes.map(m=>`<div style="margin-top:6px"><span style="text-decoration:line-through;color:var(--red-d)">${esc(m.said)}</span> → <b style="color:var(--green-d)">${esc(m.correct)}</b><button class="say" data-say="${esc(m.correct)}" data-rate="0.7">🔊</button><div class="es">${esc(m.why)}</div></div>`).join("")}`:""}
      ${(r.words||[]).length?`<div style="margin-top:12px;font-weight:900">📚 Palabras para aprender</div>${r.words.map(w=>`<div style="margin-top:4px"><b>${esc(w.en)}</b> <button class="say" data-say="${esc(w.en)}" data-rate="0.75">🔊</button> <span class="es">— ${esc(w.es)}</span></div>`).join("")}`:""}
      ${r.advice?`<div class="tip" style="background:var(--soft-yellow)"><b>💡 Para la próxima</b>${esc(r.advice)}</div>`:""}
      <button class="btn full" style="margin-top:14px" id="labAgain">🔁 Repetir laboratorio</button>`);
    $("#labAgain").onclick=()=>openLab(L.li,LABS[L.li].findIndex(x=>x.id===L.id));
    speakLines([{text:`Terminaste el laboratorio. Tu resultado es ${sc} de 100.`,lang:"es"}]);
    if(sc>=70) confetti();
  }catch(e){ box.innerHTML="No pude evaluarte 😕 Intenta otra vez."; }
  busy=false; updMic();
}

/* =========================================================
   PRÁCTICA INFINITA (generador de ~50,000 frases, sin IA)
   ========================================================= */
function startInfinite(li){
  const seen=new Set(P.genSeen||[]);
  const {phrases,keys}=GEN.pick(li,5,seen);
  P.genSeen=[...(P.genSeen||[]),...keys].slice(-5000); save();
  const pool=[...phrases,...LEVELS[li].units.flatMap(u=>UNITS[u].phrases)];
  const q=[]; phrases.forEach(p=>{ q.push({render:rChoose,p,pool}); q.push({render:rRepeat,p}); });
  startRun(q,{title:`Práctica infinita ${LV_CODES[li]}`,again:()=>startInfinite(li)});
}

/* =========================================================
   LABORATORIOS SIN IA (con las conversaciones escritas)
   ========================================================= */
let SC=null;
function openScriptLab(li,j){
  const L=LABS[li][j];
  CH={name:L.who,av:L.av,bg:"var(--soft-purple)",voice:L.voice,level:LV_CODES[li],scripted:true,lab:Object.assign({li,done:[],announced:false},L)};
  history=[]; turns=0; chat.innerHTML="";
  $("#cAv").textContent=L.av; $("#cAv").style.background=CH.bg;
  $("#cName").textContent=L.title;
  $("#cSub").textContent=`🧪 Laboratorio ${CH.level} · con ${L.who}`;
  SC={script:SCRIPTS[L.id]||[],ti:0,scores:[],mist:[],tries:0};
  renderLabPanel(); show("chatView"); scriptTurn();
}
function scriptTurn(){
  const t=SC.script[SC.ti];
  if(!t){ finishLab(); return; }
  SC.tries=0;
  history.push({r:"t",text:t[0]});
  addMsg("t",`<div class="who">${CH.av} ${esc(CH.name)}</div><div class="en">${esc(t[0])} <button class="say" data-say="${esc(t[0])}" data-voice="${CH.voice}">🔊</button><button class="say" data-say="${esc(t[0])}" data-rate="0.65" data-voice="${CH.voice}">🐢</button></div><details class="es"><summary style="cursor:pointer">Ver en español</summary>${esc(t[1])}</details>`);
  addMsg("suggest",`<div class="lbl">Puedes responder algo como:</div>`+t[2].map(o=>`<div style="margin-top:6px"><span class="en" style="font-size:17px;font-weight:800">${esc(o[0])}</span> <button class="say" data-say="${esc(o[0])}" data-rate="0.75">🔊</button><div class="es">${esc(o[1])}</div></div>`).join("")+
    `<div class="es" style="margin-top:8px">💡 Puedes cambiar los detalles (nombres, días, números) por los tuyos.</div>`);
  busy=false; updMic(); cctx.label.textContent="Toca para responder";
  speakLines([{text:t[0],lang:"en",rate:0.85,voice:CH.voice}]);
}
function scriptHeard(said){
  const t=SC.script[SC.ti]; if(!t) return;
  chat.querySelectorAll(".suggest").forEach(s=>s.remove());
  const me=addMsg("m",`<div class="who">Tú</div><div class="en">${esc(said)}</div>`);
  const S=norm(said); let best=null;
  for(const o of t[2]){ const T=norm(o[0]), d=diff(T,S), pct=d.ok.filter(Boolean).length/T.length; if(!best||pct>best.pct) best={o,pct,errs:d.errs}; }
  const box=document.createElement("div");
  if(best.pct>=0.5){
    SC.scores.push(best.pct); turns++; history.push({r:"m",text:said});
    if(t[3]&&!CH.lab.done.includes(t[3])) CH.lab.done.push(t[3]);
    const fixes=best.errs.filter(e=>e.said);
    let lines;
    if(best.pct>=0.95||!fixes.length){
      box.className="fixbox ok"; box.innerHTML="✅ ¡Bien dicho! <span class='xpgain'>+5 XP</span>"; addXP(5);
      lines=[];
    } else {
      SC.mist.push(...fixes.map(e=>({said:e.said,correct:e.want})));
      box.className="fixbox";
      box.innerHTML="<b>✏️ Se entendió, pero ojo:</b>"+fixes.slice(0,3).map(e=>`<div style="margin-top:6px"><span style="text-decoration:line-through;color:var(--red-d)">${esc(e.said)}</span> → <b style="color:var(--green-d)">${esc(e.want)}</b><button class="say" data-say="${esc(e.want)}" data-rate="0.7">🔊</button></div>`).join("")+
        `<div class="es" style="margin-top:6px">Así se dice completo: <b>${esc(best.o[0])}</b></div>`;
      lines=corrLines(fixes,null);
    }
    me.appendChild(box);
    renderLabPanel();
    if(!CH.lab.announced&&CH.lab.done.length===CH.lab.goals.length){ CH.lab.announced=true; confetti(); }
    SC.ti++;
    busy=true; updMic();
    speakLines(lines.length?lines:[{text:"¡Bien!",lang:"es"}]).then(()=>setTimeout(scriptTurn,300));
  } else {
    SC.tries++;
    box.className="fixbox";
    box.innerHTML=`<b>🤔 No te entendí bien.</b><div class="es" style="margin-top:4px">Intenta decir algo como:</div><div style="margin-top:4px"><b style="color:var(--green-d)">${esc(best.o[0])}</b> <button class="say" data-say="${esc(best.o[0])}" data-rate="0.7">🔊</button></div>`+
      (SC.tries>=2?`<button class="btn white" style="margin-top:10px;padding:8px 12px;font-size:15px" id="scSkip">Seguir con la conversación →</button>`:"");
    me.appendChild(box);
    if(SC.tries>=2) box.querySelector("#scSkip").onclick=()=>{ box.querySelector("#scSkip").remove(); SC.scores.push(0); SC.ti++; scriptTurn(); };
    // volver a mostrar las sugerencias
    addMsg("suggest",`<div class="lbl">Inténtalo otra vez:</div>`+t[2].map(o=>`<div style="margin-top:6px"><span class="en" style="font-size:17px;font-weight:800">${esc(o[0])}</span> <button class="say" data-say="${esc(o[0])}" data-rate="0.75">🔊</button></div>`).join(""));
    speakLines([{text:"No te entendí bien. Intenta decir:",lang:"es"},{text:best.o[0],lang:"en",rate:0.7}]);
  }
}
function scriptFinish(){
  const L=CH.lab, n=SC.scores.length;
  if(n<2){ addMsg("suggest",`<div class="lbl">Habla un poco más</div><div class="es" style="color:var(--ink)">Responde por lo menos 2 veces para poder evaluarte.</div>`); return; }
  const avg=SC.scores.reduce((a,b)=>a+b,0)/n;
  const prog=Math.min(1,SC.ti/SC.script.length), goals=L.done.length/L.goals.length;
  const sc=Math.round(100*(avg*0.6+prog*0.2+goals*0.2));
  P.labs=P.labs||{}; P.labs[L.id]=Math.max(P.labs[L.id]||0,sc); save(); addXP(30);
  const bar=(lbl,v)=>`<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px"><span>${lbl}</span><span>${Math.round(v)}</span></div><div class="pbar"><div style="width:${Math.round(v)}%"></div></div></div>`;
  const uniq=[]; SC.mist.forEach(m=>{ if(!uniq.some(u=>u.correct===m.correct)) uniq.push(m); });
  const key=SC.script.filter(t=>t[3]).slice(0,5).map(t=>t[2][0]);
  addMsg("t report",`<div style="text-align:center"><div style="font-size:56px">${sc>=80?"🏆":sc>=60?"🎉":"💪"}</div><div style="font-weight:900;font-size:22px">Resultado: ${sc}/100</div><div class="xpgain">+30 XP</div></div>
    ${bar("🗣️ Pronunciación (palabras entendidas)",avg*100)}${bar("💬 Conversación completada",prog*100)}${bar("🎯 Metas cumplidas",goals*100)}
    ${uniq.length?`<div style="margin-top:12px;font-weight:900">✏️ Palabras para practicar</div>${uniq.slice(0,6).map(m=>`<div style="margin-top:6px"><span style="text-decoration:line-through;color:var(--red-d)">${esc(m.said)}</span> → <b style="color:var(--green-d)">${esc(m.correct)}</b><button class="say" data-say="${esc(m.correct)}" data-rate="0.7">🔊</button></div>`).join("")}`:`<div style="margin-top:12px;font-weight:900">✅ ¡Sin errores de pronunciación!</div>`}
    <div style="margin-top:12px;font-weight:900">📚 Frases clave de esta conversación</div>${key.map(k=>`<div style="margin-top:4px"><b>${esc(k[0])}</b> <button class="say" data-say="${esc(k[0])}" data-rate="0.75">🔊</button><div class="es">${esc(k[1])}</div></div>`).join("")}
    <button class="btn full" style="margin-top:14px" id="labAgain">🔁 Repetir laboratorio</button>`);
  $("#labAgain").onclick=()=>openScriptLab(L.li,LABS[L.li].findIndex(x=>x.id===L.id));
  speakLines([{text:`Terminaste el laboratorio. Tu resultado es ${sc} de 100.`,lang:"es"}]);
  if(sc>=70) confetti();
  SC.ti=SC.script.length; busy=true; updMic();
}

/* =========================================================
   CELEBRACIONES
   ========================================================= */
const CONF_COLORS=["#22b573","#3b82f6","#ffc531","#f0544f","#8b5cf6","#ff8a3d"];
function confBits(n){ let h=""; for(let i=0;i<n;i++) h+=`<i class="conf" style="left:${Math.random()*100}%;background:${CONF_COLORS[i%6]};animation-delay:${(Math.random()*1.5).toFixed(2)}s;animation-duration:${(2.5+Math.random()*2.5).toFixed(2)}s;width:${6+Math.random()*8|0}px"></i>`; return h; }
function confetti(){
  const o=document.createElement("div"); o.className="party light"; o.innerHTML=confBits(70);
  document.body.appendChild(o); setTimeout(()=>o.remove(),5500);
}
function levelParty(li){
  const code=LV_CODES[li], next=LEVELS[li+1];
  const B=["🎈","🎈","🎉","🎈","🎊","⭐","🎈","🥳"];
  let h=""; for(let i=0;i<28;i++) h+=`<span class="balloon" style="left:${Math.random()*94}%;animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(4+Math.random()*3).toFixed(2)}s;font-size:${36+Math.random()*34|0}px">${B[i%B.length]}</span>`;
  addXP(100);
  const o=document.createElement("div"); o.className="party";
  o.innerHTML=h+confBits(90)+`<div class="party-card"><div class="badge">${["🥉","🥈","🥇","🏆","👑"][li]}</div>
    <h2>¡Pasaste el nivel ${code}!</h2>
    <p class="sub">${next?`Terminaste todas las lecciones de <b>${LEVELS[li].name}</b>. Ya puedes con el <b>${next.name}</b>. ¡Sigue así!`:"¡Terminaste TODO el curso! Ya hablas inglés de nivel avanzado. 👏"}</p>
    <div class="bigstat"><div>⭐ ${P.xp}<small>XP total</small></div><div>🔥 ${P.streak}<small>Racha</small></div></div>
    <button class="btn full" id="partyOk">${next?"¡Vamos al "+next.name.split(" · ")[0]+"! 🚀":"¡Lo logré! 🎉"}</button></div>`;
  document.body.appendChild(o);
  speakLines([{text:`¡Felicidades! Pasaste el nivel ${code}.`,lang:"es"},{text:"Congratulations! You did it!",lang:"en"}]);
  o.querySelector("#partyOk").onclick=()=>{ o.remove(); P.levelsDone=P.levelsDone||{}; P.levelsDone[li]=true; save(); openTab("path"); if(next) setTimeout(()=>{ const el=$("#lv"+(li+1)); if(el) el.scrollIntoView({behavior:"smooth"}); },150); };
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
openTab("path");
setupCaps();
$("#setBtn").onclick=openSettings;
</script>
